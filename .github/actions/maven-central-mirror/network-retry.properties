
# Appended to gradle.properties of the Gradle user home by the action in this directory.
# Gradle retries a dependency download that fails with 408, 429, a 5xx status or a dropped connection: by default 3
# attempts with a back-off from 1 s, doubled each time, which a rate limit outlasts. Here 6 attempts from 5 s, up to
# 155 s of waiting per request. These are internal Gradle properties, read by ErrorHandlingModuleComponentRepository
# (org.gradle.internal.network.retry.* are for publishing only). Checked against Gradle 9.1; check them again when the
# wrapper is upgraded.
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=5000
