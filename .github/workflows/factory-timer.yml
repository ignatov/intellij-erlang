name: Factory timer

# The clock of the project's automation. The dispatcher (factory-tick.yml, which runs dispatcher/dispatch.py of the
# private repository ignatov/intellij-erlang-triage) moves bug-fix work from one agent session to the next and has
# to see the end of each session and CI run. GitHub drops most scheduled runs of a quiet repository, so each live
# tick arms this timer at its end instead:
#   1. the job "wait" waits in the environment factory-timer-<pace>; the wait timer of that environment
#      decides how long (since 2026-11-17: active 10 minutes while the next tick can move something, idle 15
#      minutes otherwise, settle 25 minutes while stale pull requests wait for master to settle); no runner is
#      used while it waits;
#   2. the job "wake" starts the next tick, factory-tick.yml of master with live.
# A new run cancels the one that is still waiting, so there is always one timer. When the chain breaks all the same,
# factory-rescue.yml starts a tick.
#
# Both the tick and this timer start each other with their own GITHUB_TOKEN: workflow_dispatch is one of the two
# events that this token may start a run with. No secret is used here.

on:
  workflow_dispatch:
    inputs:
      pace:
        description: the environment factory-timer-<pace> to wait in; its wait timer decides how long
        type: choice
        options:
          - active
          - idle
          - settle
        default: idle

permissions: {}

concurrency:
  group: factory-timer
  cancel-in-progress: true

jobs:
  wait:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: factory-timer-${{ inputs.pace }}
      # The environment is used for its wait timer only; this is not a deployment.
      deployment: false
    steps:
      - run: echo "The wait is over."

  wake:
    needs: wait
    runs-on: ubuntu-24.04
    # The retries of "Start the next tick" take up to 16 minutes.
    timeout-minutes: 20
    permissions:
      actions: write
    steps:
      - name: Start the watch when it has no run
        # factory-watch.yml has a loop of its own; this restarts it when it broke. It never fails this job.
        if: vars.FACTORY_WATCH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          busy=$(gh run list -R "$REPO" -w factory-watch.yml -L 20 --json status \
            --jq '[.[] | select(.status != "completed")] | length') || busy=""
          if [ "$busy" = "0" ]; then
            gh workflow run factory-watch.yml -R "$REPO" --ref master -f wait=true \
              || echo "::warning::The watch could not be started."
          fi

      - name: Start the next tick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # 7 tries over about 16 minutes.
          WAITS: 15 30 60 120 240 480
        run: |
          # Runs a gh command again when GitHub failed on its side (HTTP 5xx, 408, 429, a rate limit) or the network
          # did, after each wait of WAITS (seconds). Any other HTTP 4xx (a bad token, no such workflow) is final.
          # On 2026-11-25 one HTTP 500 of a dispatch stopped the clock for 1.5 hours. The same function is in
          # factory-tick.yml, factory-timer.yml, factory-wake.yml and factory-rescue.yml; scripts/factory tests them.
          retry() {
            local wait out
            for wait in $WAITS last; do
              if out=$("$@" 2>&1); then
                [ -z "$out" ] || printf '%s\n' "$out"
                return 0
              fi
              printf '%s\n' "$out"
              if grep -Eq 'HTTP 4[0-9]{2}|could not find any workflows' <<< "$out" \
                && ! grep -Eqi 'HTTP (408|429)|rate limit' <<< "$out"; then
                echo "A final error: no retry."
                return 1
              fi
              [ "$wait" != last ] || return 1
              echo "Retrying in $wait seconds."
              sleep "$wait"
            done
          }
          if ! retry gh workflow run factory-tick.yml -R "$REPO" --ref master -f live=true; then
            echo "::error::The next tick could not be started."
            exit 1
          fi
