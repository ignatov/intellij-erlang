name: Factory tick

# One tick of the project's automation: the dispatcher (dispatcher/dispatch.py of the private repository
# ignatov/intellij-erlang-triage) moves bug-fix work from one agent session to the next. It ran in the private
# repository until 2026-11-17; it runs here because the Actions minutes of a public repository are free.
#
# Started by factory-timer.yml (the clock), factory-wake.yml (a push to master, an owner's "/" command in a pull
# request), a person (workflow_dispatch) and an hourly schedule, the backstop for a broken timer chain.
# It acts (--live) only when the run is scheduled or was started with "live", the repository variable
# FACTORY_TICK_LIVE is "true" and the secret FACTORY_TOKEN is set. Otherwise it is a dry run that only reads.
# A live tick also needs the deploy gate: when the code of the private main changed since its tests last passed
# here, the dispatcher tests run first, and when they fail no dispatcher code runs (not even dry, so that it
# never runs next to the tokens) and the job fails (see the step "Test the dispatcher code").
#
# What keeps the secrets in:
#   - They are secrets of the environment factory-dispatch, which only jobs of master can use. There is no
#     pull_request or pull_request_target trigger, so a pull request or a fork never runs this workflow.
#   - This job holds the maintainer's token, so it has no "uses:" step and never checks out this repository: it
#     runs nothing from this repository's tree. It fetches the private repository with plain git, the token
#     coming from an askpass script that reads it from the environment (never on a command line or in a URL),
#     and runs the private dispatcher from that checkout.
#   - The log of a public run is public. The tick's output goes to a file, and this log shows only the mode,
#     the exit status, the number of lines, the last "requests: ..." line (counts and quota) and the pace. No
#     artifact (an artifact of a public run is public) and no step summary. The full log is committed as
#     last-tick.log to the branch tick-log of the private repository on every run, also a dry or failed one.
#   - Values from the event and the inputs reach the scripts only through env, never inside a script.
#
# Secrets of factory-dispatch: FACTORY_TOKEN (the maintainer's token for this repository and the agent tasks API,
# as in the private repository) and, optionally, FACTORY_DESK_TOKEN for the private repository (clone, push,
# cards and the panel); when it is empty, FACTORY_TOKEN is used for the private repository too. FACTORY_LOG_TOKEN
# (optional) goes only to the step "Tick"; see there. AMPLITUDE_API_KEY and AMPLITUDE_SECRET_KEY (optional) go only to
# the step "Tick" too: the dispatcher reads the plugin's usage statistics back from Amplitude with them.

on:
  workflow_dispatch:
    inputs:
      live:
        description: Act instead of a dry run (also needs FACTORY_TICK_LIVE=true and the FACTORY_TOKEN secret)
        type: boolean
        default: false
  schedule:
    - cron: '41 * * * *'

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Re-arming the timer: GITHUB_TOKEN starts factory-timer.yml with workflow_dispatch.
    permissions:
      actions: write
    environment:
      name: factory-dispatch
      # The environment is used for its secrets and its branch policy only; this is not a deployment.
      deployment: false
    # One tick runs and at most one waits; two ticks at once would corrupt the state.
    concurrency:
      group: factory-tick
      cancel-in-progress: false
    env:
      DESK_REPO: ignatov/intellij-erlang-triage
      GIT_TERMINAL_PROMPT: '0'
      # No credential helper of the runner stores or offers anything; the askpass script answers.
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: credential.helper
      GIT_CONFIG_VALUE_0: ''
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Choose the mode
        id: mode
        env:
          HAS_TOKEN: ${{ secrets.FACTORY_TOKEN != '' }}
          LIVE_VAR: ${{ vars.FACTORY_TICK_LIVE }}
          EVENT: ${{ github.event_name }}
          LIVE_INPUT: ${{ inputs.live }}
        run: |
          mode=dry-run
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "The secret FACTORY_TOKEN is not set: dry run."
          elif [ "$LIVE_VAR" != "true" ]; then
            echo "The repository variable FACTORY_TICK_LIVE is not true: dry run."
          elif [ "$EVENT" = "schedule" ] || [ "$LIVE_INPUT" = "true" ]; then
            mode=live
          else
            echo "Started without live: dry run."
          fi
          echo "Mode: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Check the token for the private repository
        env:
          DESK_TOKEN: ${{ secrets.FACTORY_DESK_TOKEN || secrets.FACTORY_TOKEN }}
          DESK_SECRET: ${{ secrets.FACTORY_DESK_TOKEN != '' && 'FACTORY_DESK_TOKEN' || 'FACTORY_TOKEN' }}
        run: |
          if [ -z "$DESK_TOKEN" ]; then
            echo "::error::Neither FACTORY_DESK_TOKEN nor FACTORY_TOKEN is set in the environment factory-dispatch."
            exit 1
          fi
          # The header comes from curl's config on stdin (printf is a shell builtin), not from the command line.
          code=$(printf 'header = "Authorization: Bearer %s"\n' "$DESK_TOKEN" \
            | curl -sS -K - -o "$RUNNER_TEMP/desk-repo.json" -w '%{http_code}' \
                -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/$DESK_REPO") || code=000
          push=$(python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1])).get("permissions", {}).get("push") is True)' \
            "$RUNNER_TEMP/desk-repo.json" 2>/dev/null) || push=False
          rm -f "$RUNNER_TEMP/desk-repo.json"
          if [ "$code" != "200" ] || [ "$push" != "True" ]; then
            echo "::error::The secret $DESK_SECRET cannot push to the private repository (HTTP $code)."
            exit 1
          fi
          echo "The secret $DESK_SECRET can push to the private repository."

      - name: Fetch the private repository
        id: clone
        env:
          DESK_TOKEN: ${{ secrets.FACTORY_DESK_TOKEN || secrets.FACTORY_TOKEN }}
          MODE: ${{ steps.mode.outputs.mode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          # The askpass script holds no secret: it prints the token from the environment of the git process.
          cat > "$RUNNER_TEMP/askpass.sh" <<'SCRIPT'
          #!/bin/sh
          case "$1" in
            Username*) echo x-access-token ;;
            *) printf '%s\n' "$DESK_TOKEN" ;;
          esac
          SCRIPT
          chmod 700 "$RUNNER_TEMP/askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass.sh"
          desk="$RUNNER_TEMP/desk"
          git clone --quiet --depth 1 --single-branch --branch main "https://github.com/$DESK_REPO.git" "$desk" \
            > "$RUNNER_TEMP/clone.log" 2>&1 || {
            grep '^fatal: ' "$RUNNER_TEMP/clone.log" || true
            echo "::error::The private repository could not be fetched."
            exit 1
          }
          { echo "run: $RUN_URL"; echo "mode: $MODE"; echo "main: $(git -C "$desk" rev-parse HEAD)"; echo; } \
            > "$RUNNER_TEMP/tick.log"
          echo "Fetched main of the private repository."

      - name: Refuse to act on an older state
        # A state that could not be pushed waits on a branch tick-state-failed/<run id>. A live tick on the older
        # state of main would repeat what that tick did, so none runs until the maintainer merges the branch.
        if: steps.mode.outputs.mode == 'live'
        env:
          DESK_TOKEN: ${{ secrets.FACTORY_DESK_TOKEN || secrets.FACTORY_TOKEN }}
        run: |
          export GIT_ASKPASS="$RUNNER_TEMP/askpass.sh"
          if ! waiting=$(git -C "$RUNNER_TEMP/desk" ls-remote --heads origin 'refs/heads/tick-state-failed/*' 2>/dev/null); then
            echo "::error::The branches of the private repository could not be listed."
            echo "The tick did not run: the branches of the private repository could not be listed." >> "$RUNNER_TEMP/tick.log"
            exit 1
          fi
          if [ -n "$waiting" ]; then
            echo "::error::A state commit waits on a branch tick-state-failed/* of the private repository. Merge it into main and delete the branch; until then no live tick runs."
            { echo "The tick did not run: a state commit waits on these branches:"; echo "$waiting"; } >> "$RUNNER_TEMP/tick.log"
            exit 1
          fi

      - name: Test the dispatcher code
        # The deploy gate: a push to main of the private repository runs live at the next tick, so a live tick
        # first tests the code when it changed. One hash of the files that decide what the tick does (every
        # dispatcher/*.py, the tests too, config.json, the prompts, the scripts of the robustness sweep that
        # sweep.py loads, and triage-config.json) is compared with dispatcher/tested-code.txt, the hash of the
        # last code whose tests passed here. Another hash runs the dispatcher tests: when they pass, the hash is
        # written and the state commit records it; when they fail, or this step fails or times out, the step
        # "Tick" runs no dispatcher code at all (not dispatch.py, not pace.py: code whose tests failed must not
        # run next to the tokens), nothing is committed to main, the timer still waits as idle, and the job
        # fails at its end.
        # No secret reaches the tests: this step maps none, the tests run under env -i (no askpass, no GIT_CONFIG_*
        # and no token variable) with a scratch HOME, on a copy of the checkout without .git. Their output goes to
        # last-tests.log of the branch tick-log only, not into last-tick.log, whose lines the watch and the
        # console parse; this log shows only the counts.
        id: gate
        if: steps.mode.outputs.mode == 'live'
        timeout-minutes: 10
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          desk="$RUNNER_TEMP/desk"
          log="$RUNNER_TEMP/tick.log"
          # sha256 over "<path> NUL <size> NUL <content>" of each file, in the order of the paths: content only.
          hash=$(cd "$desk" && python3 -I -c '
          import glob, hashlib, os
          paths = set()
          for pattern in ("dispatcher/*.py", "dispatcher/config.json", "dispatcher/*-prompt.md",
                          "discovery/robustness-sweep/*.py", "triage-config.json"):
              paths.update(p for p in glob.glob(pattern) if os.path.isfile(p))
          h = hashlib.sha256()
          for p in sorted(paths):
              with open(p, "rb") as f:
                  data = f.read()
              h.update(p.encode() + b"\0" + str(len(data)).encode() + b"\0" + data)
          print(h.hexdigest())
          ')
          [ "${#hash}" = 64 ] || { echo "::error::Deploy gate: the code hash could not be computed."; exit 1; }
          short=${hash:0:12}
          tested=$(head -n 1 "$desk/dispatcher/tested-code.txt" 2> /dev/null) || tested=""
          if [ "$hash" = "$tested" ]; then
            echo "Deploy gate: this code passed its tests before."
            echo "deploy gate: the code $short passed its tests before" >> "$log"
            echo "result=tested" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The askpass script reads the token from the environment of git and holds none; the clone keeps none.
          if grep -Eqi 'extraheader|x-access-token:|gh[pousr]_|github_pat_' "$desk/.git/config"; then
            echo "::error::Deploy gate: the configuration of the checkout holds a credential; the tests do not run."
            echo "deploy gate: dispatcher tests failed on $short, the tick did not run (a credential in .git/config)" >> "$log"
            echo "result=failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tree="$RUNNER_TEMP/gate-tree"
          home="$RUNNER_TEMP/gate-home"
          out="$RUNNER_TEMP/last-tests.log"
          mkdir "$tree" "$home"
          tar -C "$desk" --exclude=.git -cf - . | tar -C "$tree" -xf -
          { echo "run: $RUN_URL"; echo "main: $(git -C "$desk" rev-parse HEAD)"; echo "code: $hash"; echo; } > "$out"
          py=$(command -v python3)
          status=0
          (cd "$tree" && env -i PATH="$PATH" HOME="$home" LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            "$py" -m unittest discover -s dispatcher -p 'test_*.py') >> "$out" 2>&1 || status=$?
          # Only numbers and fixed words of the summary of unittest reach this public log.
          ran=$(grep -Eo '^Ran [0-9]+ tests?' "$out" | tail -n 1 | grep -Eo '[0-9]+') || ran=0
          summary=$(grep -E '^(OK|FAILED)( \(((failures|errors|skipped|expected failures|unexpected successes)=[0-9]+(, )?)+\))?$' \
            "$out" | tail -n 1) || summary=""
          if [ "$status" = 0 ] && [ "${summary%% *}" = OK ] && [ "$ran" -gt 0 ]; then
            printf '%s\n%s\n' "$hash" "# The code hash of the last dispatcher tests that passed in factory-tick.yml of the public repository." \
              > "$desk/dispatcher/tested-code.txt"
            echo "Deploy gate: the dispatcher tests passed: $ran tests, $summary."
            echo "deploy gate: dispatcher tests passed on $short ($ran tests), the output is last-tests.log of the branch tick-log" >> "$log"
            echo "result=passed" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Deploy gate: the dispatcher tests failed (exit status $status, $ran tests, ${summary:-no summary line}); the tick does not run."
            echo "deploy gate: dispatcher tests failed on $short, the tick did not run; the output is last-tests.log of the branch tick-log" >> "$log"
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Tick
        id: tick
        env:
          FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          # Optional: an OAuth token of the GitHub CLI, only for reading session logs on the Copilot API host, which
          # rejects personal access tokens. Without it the dispatcher cannot read what a review session concluded.
          FACTORY_LOG_TOKEN: ${{ secrets.FACTORY_LOG_TOKEN }}
          # Optional: the API key and the secret key of the Amplitude project of the plugin's usage statistics, only for
          # the Export API of Amplitude (analytics.eu.amplitude.com), once a day. Without them the dispatcher reads no
          # usage (dispatcher/usage.py of the private repository).
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          AMPLITUDE_SECRET_KEY: ${{ secrets.AMPLITUDE_SECRET_KEY }}
          CARD_TOKEN: ${{ secrets.FACTORY_DESK_TOKEN || secrets.FACTORY_TOKEN }}
          PYTHONUNBUFFERED: '1'
          MODE: ${{ steps.mode.outputs.mode }}
          GATE: ${{ steps.gate.outputs.result }}
        run: |
          cd "$RUNNER_TEMP/desk"
          log="$RUNNER_TEMP/tick.log"
          # A live tick only on code that passed its tests (the step "Test the dispatcher code"). Otherwise no
          # code of the private repository runs here, not even dry: it would run next to the tokens. The public
          # lines stay the same, and the step ends green so that the log, the timer (idle) and the console go
          # on as after any tick; the last step of the job fails it.
          if [ "$MODE" = live ] && [ "$GATE" != passed ] && [ "$GATE" != tested ]; then
            if [ "$GATE" != failed ]; then
              echo "deploy gate: dispatcher tests failed on unknown, the tick did not run (the gate step did not finish)" >> "$log"
            fi
            echo "Mode: skipped (deploy gate)"
            echo "Exit status: 0"
            count=$(wc -l < "$log")
            echo "Log lines: $((count))"
            echo "requests: (no such line in the log)"
            echo "Pace: idle"
            echo "pace=idle" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=0
          python3 dispatcher/dispatch.py "--$MODE" >> "$log" 2>&1 || status=$?
          echo "Mode: $MODE"
          echo "Exit status: $status"
          count=$(wc -l < "$log")
          echo "Log lines: $((count))"
          # Only a line of exactly this form: it holds token names, counts and times, nothing of the items.
          requests_re='^requests: [0-9]+ \(([A-Z_]+ [0-9]+(, )?)*\), rate limit remaining: (unknown|([A-Z_]+ [0-9]+ until ([0-9]{2}:[0-9]{2} UTC|\?)(, )?)+)$'
          line=$(grep -E "$requests_re" "$log" | tail -n 1) || line=""
          echo "${line:-requests: (no such line in the log)}"
          pace=$(python3 dispatcher/pace.py dispatcher/state.json 2>> "$log") || pace=""
          case "$pace" in
            active|idle|settle) ;;
            *) echo "pace.py printed no known pace; the timer would wait as idle." >> "$log"; pace=idle ;;
          esac
          echo "Pace: $pace"
          echo "pace=$pace" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Commit the state
        id: state
        # Also after a failed tick: actions already taken must be recorded, or the next tick repeats them.
        if: always() && steps.mode.outputs.mode == 'live' && steps.tick.outcome != 'skipped'
        env:
          DESK_TOKEN: ${{ secrets.FACTORY_DESK_TOKEN || secrets.FACTORY_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          GATE: ${{ steps.gate.outputs.result }}
        run: |
          export GIT_ASKPASS="$RUNNER_TEMP/askpass.sh"
          cd "$RUNNER_TEMP/desk"
          out="$RUNNER_TEMP/state-push.log"
          # No tick ran when the deploy gate did not pass: there is nothing to record.
          if [ "$GATE" != passed ] && [ "$GATE" != tested ]; then
            echo "State: not committed, the tick did not run (the deploy gate did not pass)."
            exit 0
          fi
          git add dispatcher/state.json dispatcher/journal.csv
          # The monthly archives of finished items that the dispatcher moves out of the state. The state keeps
          # only a stub of each such item, so the state must never be committed without them: a failure here stops
          # the step, as for the state itself. The folder does not exist until the dispatcher makes it.
          if [ -e dispatcher/data ]; then
            git add -- dispatcher/data
          fi
          # What the driver of the robustness sweep keeps beside the state: the coverage ledger, the known
          # signatures and the summaries of the collected runs. And what the hypothesis hunt keeps there: its
          # coverage ledger, the hypotheses and the card of each unit, and the issue drafts. And the hash of the
          # code whose tests passed (the deploy gate). A path that the tick has not made yet is skipped, and one
          # that cannot be added must not keep the state from being committed.
          for path in discovery/robustness-sweep/ledger.jsonl discovery/robustness-sweep/known-signatures.tsv \
              discovery/robustness-sweep/runs discovery/robustness-hunt dispatcher/steps.csv dispatcher/tested-code.txt; do
            if [ -e "$path" ] && ! git add -- "$path" >> "$out" 2>&1; then
              echo "::warning::A file of the robustness sweep, of the hypothesis hunt, of the step record or of the deploy gate could not be added to the state commit."
            fi
          done
          if git diff --cached --quiet; then
            echo "State: no change."
            exit 0
          fi
          git commit --quiet -m "Record a dispatcher tick [skip ci]" >> "$out" 2>&1
          for attempt in 1 2 3; do
            if git pull --quiet --rebase origin main >> "$out" 2>&1 && git push --quiet origin HEAD:main >> "$out" 2>&1; then
              echo "State: pushed to main."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            git rebase --abort >> "$out" 2>&1 || true
            sleep $((attempt * 5))
          done
          if git push --quiet origin "HEAD:refs/heads/tick-state-failed/$RUN_ID" >> "$out" 2>&1; then
            echo "::error::The state could not be pushed to main. It is on the branch tick-state-failed/$RUN_ID of the private repository: merge it into main and delete the branch."
          else
            echo "::error::The state could not be pushed to main or to a branch of the private repository; the log on the branch tick-log has what the tick did."
          fi
          exit 1

      - name: Keep the log in the private repository
        if: always() && steps.clone.outcome == 'success'
        env:
          DESK_TOKEN: ${{ secrets.FACTORY_DESK_TOKEN || secrets.FACTORY_TOKEN }}
          MODE: ${{ steps.mode.outputs.mode }}
          RUN_ID: ${{ github.run_id }}
        run: |
          export GIT_ASKPASS="$RUNNER_TEMP/askpass.sh"
          cd "$RUNNER_TEMP/desk"
          file="$RUNNER_TEMP/last-tick.log"
          cp "$RUNNER_TEMP/tick.log" "$file"
          if [ -s "$RUNNER_TEMP/state-push.log" ]; then
            { echo; echo "--- git, the state commit"; cat "$RUNNER_TEMP/state-push.log"; } >> "$file"
          fi
          # tick-log is a history of its own that holds only last-tick.log and last-tests.log (the output of the
          # last dispatcher tests of the deploy gate): no workflow file, so its pushes start no workflow there. A
          # new commit on its tip, made without touching the checkout of main.
          blob=$(git hash-object -w "$file")
          tests=""
          if [ -s "$RUNNER_TEMP/last-tests.log" ]; then
            tests=$(git hash-object -w "$RUNNER_TEMP/last-tests.log")
          fi
          for _ in 1 2; do
            parent=""
            if git fetch --quiet --depth 1 origin refs/heads/tick-log > /dev/null 2>&1; then
              parent=$(git rev-parse FETCH_HEAD)
            fi
            # last-tests.log of this run, else the one the branch has.
            kept=""
            if [ -n "$tests" ]; then
              kept=$(printf '100644 blob %s\tlast-tests.log' "$tests")
            elif [ -n "$parent" ]; then
              kept=$(git ls-tree "$parent" -- last-tests.log 2> /dev/null) || kept=""
            fi
            tree=$({ printf '100644 blob %s\tlast-tick.log\n' "$blob"; [ -z "$kept" ] || printf '%s\n' "$kept"; } \
              | git mktree) || tree=$(printf '100644 blob %s\tlast-tick.log\n' "$blob" | git mktree)
            commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "Record the log of a tick [skip ci]" \
              -m "Run $RUN_ID, $MODE.")
            if git push --quiet origin "$commit:refs/heads/tick-log" > /dev/null 2>&1; then
              echo "The log is on the branch tick-log of the private repository."
              exit 0
            fi
            sleep 5
          done
          echo "::warning::The log could not be pushed to the branch tick-log of the private repository."

      - name: Arm the timer for the next tick
        # GitHub drops most scheduled runs, so the next tick is asked for here: factory-timer.yml waits in the
        # environment factory-timer-<pace> (its wait timer decides: active 10 minutes, idle 15, settle 25) and then
        # starts this workflow again. A new timer replaces the one that is waiting. Not after a state that could
        # not be pushed (the next tick refuses to act until the maintainer has merged it). Off unless the
        # repository variable FACTORY_TIMER is "true".
        if: >-
          always() && steps.mode.outputs.mode == 'live' && vars.FACTORY_TIMER == 'true'
          && steps.tick.outcome != 'skipped' && steps.state.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PACE: ${{ steps.tick.outputs.pace }}
          REPO: ${{ github.repository }}
        run: |
          case "$PACE" in active|idle|settle) ;; *) PACE=idle ;; esac
          if ! gh workflow run factory-timer.yml -R "$REPO" --ref master -f pace="$PACE"; then
            echo "::warning::The timer could not be armed; the next tick waits for the hourly schedule or an event."
          fi

      - name: Start a build of the hosted console
        # factory-console.yml publishes a new snapshot of the console, which now shows this tick. It gets no
        # secret from here; its concurrency group queues builds. Off unless the repository variable
        # FACTORY_CONSOLE is "true".
        if: ${{ !cancelled() && vars.FACTORY_CONSOLE == 'true' && steps.clone.outcome == 'success' }}
        # A hung gh must not hold the tick (and the next tick, which waits in its concurrency group).
        timeout-minutes: 2
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh workflow run factory-console.yml -R "$REPO" --ref master; then
            echo "::warning::The console build could not be started; the daily schedule or the next tick starts one."
          fi

      - name: Fail when the deploy gate stopped the tick
        # Last, so that the log, the timer and the console come first: the timer keeps starting ticks until the
        # code is fixed, and the next tick tests the new code.
        if: >-
          !cancelled() && steps.mode.outputs.mode == 'live' && steps.gate.outcome != 'skipped'
          && steps.gate.outputs.result != 'passed' && steps.gate.outputs.result != 'tested'
        run: |
          echo "::error::Deploy gate: the dispatcher tests failed on main of the private repository, or could not run, so the tick did not run. Their output is last-tests.log of the branch tick-log there."
          exit 1
