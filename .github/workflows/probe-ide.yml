name: Probe IDE modules

# A one-off probe (not for merging): where the test runner and structure view classes live in 2026.2.
on:
  push:
    branches:
      - line-261-probe-263

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Download IntelliJ IDEA 2026.2
      run: |
        link=$(curl -fsSL 'https://data.services.jetbrains.com/products/releases?code=IIU&type=release&majorVersion=2026.2&latest=true' \
          | python3 -c 'import json,sys; d=json.load(sys.stdin); r=list(d.values())[0][0]; print(r["downloads"]["linux"]["link"])')
        echo "$link"
        curl -fsSL --retry 3 -o idea.tar.gz "$link"
        mkdir idea && tar -xzf idea.tar.gz -C idea --strip-components=1
        cat idea/build.txt
    - name: Find the classes
      run: |
        cd idea
        for class in com/intellij/execution/testframework/sm/runner/SMTestLocator.class \
                     com/intellij/execution/testframework/sm/runner/ui/SMTRunnerConsoleView.class \
                     com/intellij/execution/testframework/sm/SMTestRunnerConnectionUtil.class \
                     com/intellij/ide/structureView/impl/common/PsiTreeElementBase.class \
                     com/intellij/xdebugger/XDebugProcess.class; do
          echo "== $class"
          find lib plugins -name '*.jar' -print0 | while IFS= read -r -d '' jar; do
            if unzip -l "$jar" 2>/dev/null | grep -q "$class"; then echo "   $jar"; fi
          done
        done
    - name: Module and plugin ids
      run: |
        cd idea
        echo "== descriptors that name testRunner, smRunner or structureView"
        grep -r -l -i -E 'testRunner|smRunner|structureView' --include='*.xml' lib plugins 2>/dev/null | head -40 || true
        echo "== product-info modules"
        python3 - <<'PY'
        import json
        d = json.load(open('product-info.json'))
        for key in ('bundledPlugins', 'modules'):
            vals = [v for v in d.get(key, []) if any(s in v.lower() for s in ('testrunner', 'smrunner', 'structureview', 'debugger', 'execution'))]
            print(key, vals)
        for item in d.get('layout', []):
            n = item.get('name', '')
            if any(s in n.lower() for s in ('testrunner', 'smrunner', 'structureview')):
                print('layout', item.get('kind'), n, item.get('classPath'))
        PY
