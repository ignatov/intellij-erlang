name: Java CI

on:
  push:
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '25'
        cache: gradle
    - name: Test, Build and Verify Plugin
      run: ./gradlew --no-daemon clean test buildPlugin verifyPlugin
    - name: Upload Plugin Artifact
      uses: actions/upload-artifact@v4
      with:
        name: intellij-erlang-plugin
        path: build/distributions/*.zip
