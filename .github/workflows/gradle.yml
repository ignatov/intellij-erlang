name: Java CI

on:
  push:
    # Branch pushes only: tag pushes (v* releases, the rolling nightly tag) never run this workflow.
    branches:
      - '**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'
        cache: gradle
    - name: Test, Build and Verify Plugin
      env:
        BUILD_NUMBER: SNAPSHOT-${{ github.run_number }}
      run: ./gradlew --no-daemon clean test buildPlugin verifyPlugin -PbuildNumber="$BUILD_NUMBER"
    - name: Upload Plugin Artifact
      uses: actions/upload-artifact@v7
      with:
        name: intellij-erlang-plugin
        path: build/distributions/*.zip
        if-no-files-found: error

  compilation-tests:
    # JPS and external build tests: they run erlc and rebar3, and the IDE starts a real build process that loads the
    # Erlang JPS plugin from the test sandbox through compileServer.plugin, like an installed plugin (#1077).
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'
        cache: gradle
    - name: Install Erlang/OTP
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends erlang-nox erlang-dev
    - name: Install rebar3
      # The official escript, pinned and checked against the sha256 that GitHub publishes for the release asset.
      # rebar3 3.28.0 supports Erlang/OTP 27 to 29.
      env:
        REBAR3_VERSION: '3.28.0'
        REBAR3_SHA256: 5a28b1cca082d3b023ec0f5df9d9f9d52557036c6f2a21c1ffa11b93a984dd42
      run: |
        rebar3="$RUNNER_TEMP/rebar3/rebar3"
        mkdir -p "$(dirname "$rebar3")"
        curl -fsSL --retry 3 -o "$rebar3" "https://github.com/erlang/rebar3/releases/download/$REBAR3_VERSION/rebar3"
        echo "$REBAR3_SHA256  $rebar3" | sha256sum -c -
        chmod +x "$rebar3"
        escript "$rebar3" version
        echo "REBAR3_PATH=$rebar3" >> "$GITHUB_ENV"
    - name: Run compilation tests
      run: |
        erlang_root="$(erl -noshell -eval 'io:put_chars(code:root_dir()), halt().')"
        echo "Erlang/OTP $(erl -noshell -eval 'io:put_chars(erlang:system_info(otp_release)), halt().') at $erlang_root"
        ./gradlew --no-daemon testCompilation -Derlang.sdk.path="$erlang_root" -Drebar.path="$REBAR3_PATH"
        # The rebar tests skip themselves without rebar; here every test has to run.
        skipped="$(grep -L 'skipped="0"' build/test-results/testCompilation/*.xml jps-plugin/build/test-results/testCompilation/*.xml || true)"
        if [[ -n "$skipped" ]]; then
          echo "::error::Compilation tests were skipped in: $skipped"
          exit 1
        fi
    - name: Upload test reports
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: compilation-test-reports
        path: |
          build/reports/tests/testCompilation
          jps-plugin/build/reports/tests/testCompilation
          .intellijPlatform/sandbox/*/*/log_testCompilation/build-log

  nightly:
    needs: [build, compilation-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nightly-release
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v7
    - name: Skip if master has moved on
      id: head
      run: |
        head="$(git ls-remote origin refs/heads/master | cut -f1)"
        if [[ "$head" == "$GITHUB_SHA" ]]; then
          echo "current=true" >> "$GITHUB_OUTPUT"
        else
          echo "master is at $head, not $GITHUB_SHA; a newer run will publish the nightly build."
          echo "current=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Download Plugin Artifact
      if: steps.head.outputs.current == 'true'
      uses: actions/download-artifact@v8
      with:
        name: intellij-erlang-plugin
        path: dist
    - name: Publish nightly pre-release
      if: steps.head.outputs.current == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_NUMBER: ${{ github.run_number }}
      run: |
        shopt -s nullglob
        zips=(dist/*.zip)
        if (( ${#zips[@]} != 1 )); then
          echo "::error::Expected exactly one plugin ZIP, found ${#zips[@]}"
          exit 1
        fi
        cp "${zips[0]}" intellij-erlang-nightly.zip

        git tag -f nightly "$GITHUB_SHA"
        git push -f origin refs/tags/nightly

        cat > nightly-notes.md <<EOF
        Unsigned development build of \`master\` at commit $GITHUB_SHA (plugin version \`$(basename "${zips[0]}" .zip | sed 's/^intellij-erlang-//')\`, CI run $RUN_NUMBER).

        It is not published to JetBrains Marketplace. To install it, open **Settings | Plugins**, choose **Install Plugin from Disk...** and select \`intellij-erlang-nightly.zip\`.
        EOF

        if gh release view nightly > /dev/null 2>&1; then
          gh release edit nightly --prerelease --title "Nightly build" --notes-file nightly-notes.md
          gh release upload nightly intellij-erlang-nightly.zip --clobber
        else
          gh release create nightly intellij-erlang-nightly.zip --verify-tag --prerelease \
            --title "Nightly build" --notes-file nightly-notes.md
        fi
