name: Factory wake

# Wakes the project's automation when master moves, which is what a merged pull request does, and when the
# maintainer writes a command in a pull request. The dispatcher (a workflow of the private repository
# ignatov/intellij-erlang-triage) moves bug-fix work from one agent session to the next; a merged pull
# request ends an item and frees the queue, and a comment of the maintainer that starts with "/" (for
# example "/merge", "/round: ...", "/close") is a decision the dispatcher reads on its next tick.
# The job starts one dispatcher tick and does nothing else. It reads nothing from the push or the comment
# that triggered it beyond the conditions of the job, and it never checks out code. The dispatcher reads
# the comment itself and checks its author again.
#
# The trigger of a merge is the push to master, not the closed pull request:
#   - GitHub blocks pull_request_target in public repositories by default from December 2, 2026;
#   - a run of pull_request_target whose pull request Copilot opened waits for a person's approval, so the
#     merge of an agent's pull request started no tick. The actor of a push is the person who merged.
# A pull request that is closed without a merge starts no tick; factory-timer.yml covers it.
#
# The end of an agent session or of a CI run is not a trigger either: GitHub holds every workflow run whose
# actor is Copilot until a person approves it, also a workflow_run of master, so such a run would only wait.
# factory-timer.yml covers those.
#
# Both triggers run the workflow of master, and FACTORY_CLOCK_TOKEN is a secret of the environment
# factory-clock, which only jobs of master can use. It is a fine-grained token for the private repository
# with the permission Actions: write and nothing else.

on:
  push:
    branches:
      - master
  issue_comment:
    types:
      - created

permissions: {}

concurrency:
  # One tick runs and at most one waits; a burst of events becomes one more tick.
  group: factory-wake
  cancel-in-progress: false

jobs:
  wake:
    # Only people with write access can push to master, so a fork cannot start ticks. A comment starts a
    # tick only when the repository owner wrote it in a pull request and it starts with "/"; comments of
    # anyone else start nothing.
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.login == github.repository_owner
        && startsWith(github.event.comment.body, '/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: factory-clock
      deployment: false
    steps:
      - name: Start a dispatcher tick
        env:
          CLOCK_TOKEN: ${{ secrets.FACTORY_CLOCK_TOKEN }}
        run: |
          if [ -z "$CLOCK_TOKEN" ]; then
            echo "::error::The environment secret FACTORY_CLOCK_TOKEN is not set."
            exit 1
          fi
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CLOCK_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data '{"ref":"main","inputs":{"live":"true"}}' \
            https://api.github.com/repos/ignatov/intellij-erlang-triage/actions/workflows/dispatcher.yml/dispatches)
          echo "HTTP $code"
          case "$code" in
            2??) ;;
            *) echo "::error::The dispatcher could not be started."; exit 1 ;;
          esac
