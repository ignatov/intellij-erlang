name: Factory wake

# Wakes the project's automation when a pull request is merged or closed. The dispatcher (a workflow of
# the private repository ignatov/intellij-erlang-triage) moves bug-fix work from one agent session to the
# next, and a merged pull request ends an item and frees the queue.
# The job starts one dispatcher tick and does nothing else. It reads nothing from the pull request that
# triggered it, and it never checks out code.
#
# The end of an agent session or of a CI run is not a trigger: GitHub holds every workflow run whose actor
# is Copilot until a person approves it, also a workflow_run of master, so such a run would only wait.
# factory-timer.yml covers those within five minutes.
#
# pull_request_target runs the workflow of master, and FACTORY_CLOCK_TOKEN is a secret of the environment
# factory-clock, which only jobs of master can use. It is a fine-grained token for the private repository
# with the permission Actions: write and nothing else.

on:
  pull_request_target:
    types:
      - closed

permissions: {}

concurrency:
  # One tick runs and at most one waits; a burst of events becomes one more tick.
  group: factory-wake
  cancel-in-progress: false

jobs:
  wake:
    # Only pull requests of this repository's own branches matter to the dispatcher; a pull request from a
    # fork must not be able to start ticks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: factory-clock
      deployment: false
    steps:
      - name: Start a dispatcher tick
        env:
          CLOCK_TOKEN: ${{ secrets.FACTORY_CLOCK_TOKEN }}
        run: |
          if [ -z "$CLOCK_TOKEN" ]; then
            echo "::error::The environment secret FACTORY_CLOCK_TOKEN is not set."
            exit 1
          fi
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CLOCK_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data '{"ref":"main","inputs":{"live":"true"}}' \
            https://api.github.com/repos/ignatov/intellij-erlang-triage/actions/workflows/dispatcher.yml/dispatches)
          echo "HTTP $code"
          case "$code" in
            2??) ;;
            *) echo "::error::The dispatcher could not be started."; exit 1 ;;
          esac
