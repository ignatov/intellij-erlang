inlay.erlang.parameter.hints.name=Parameter names
inlay.erlang.parameter.hints.description=Shows parameter names before the arguments of Erlang function calls. \
  A name comes from the variables in the function clauses or, failing that, from the <code>-spec</code>. \
  No hint is shown when the argument already has the same name, for one-letter names, \
  or when a one-argument function name contains the parameter name.
inlay.erlang.parameter.hints.pattern.summaries.name=Pattern summaries for unnamed parameters
inlay.erlang.parameter.hints.pattern.summaries.description=When no clause binds a parameter to a variable, \
  shows a short summary of the patterns instead, such as <code>true|false</code> or <code>#state{}</code>. \
  Long summaries are cut to a few characters and end with an ellipsis.
