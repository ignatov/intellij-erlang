Reports a <code>case</code> expression that has only one clause, with or without a guard.
<p>
Such a <code>case</code> is valid Erlang and the compiler does not warn about it, but it often hides a simpler
construct or a missing clause. This is the same rule as <code>no_single_clause_case</code> of the Elvis linter.
</p>
