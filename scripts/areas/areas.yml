# The code areas of the plugin. The factory labels issues and pull requests with them (area:<name>).
#
# Every file of src/, grammars/, gen/, resources/, jps-plugin/, tests/ and testData/ belongs to exactly one area.
# Check: python3 scripts/areas/check_areas.py. A new package or directory needs an entry here.
#
# Globs are relative to the repository root. "**" matches any characters, "/" included; "*" matches any
# characters except "/". When globs of several areas match a file, the most specific one wins: the glob with the
# longest text before its first "*" (a glob without "*" names one file and always wins). Two areas whose winning
# globs are equally specific are an error of the map.
#
# A description is at most 100 characters, the limit of a GitHub label description.
#
# The format is a fixed subset of YAML, read by check_areas.py without a YAML library: each area is
# "- name:", then "  label:", "  description:" and "  paths:", each path on a line "    - "glob"".

- name: parser
  label: area:parser
  description: "Lexer, grammar, generated parser and PSI, the parser definition."
  paths:
    - "grammars/**"
    - "gen/**"
    - "src/org/intellij/erlang/parser/**"
    - "src/org/intellij/erlang/ErlangParserDefinition.java"
    - "src/org/intellij/erlang/ErlangLanguage.java"
    - "src/org/intellij/erlang/ErlangFileType.java"
    - "tests/org/intellij/erlang/parser/**"
    - "testData/parser/**"
    - "testData/verifier2/**"
- name: macro
  label: area:macro
  description: "Macro expansion layer and the macro expander."
  paths:
    - "src/org/intellij/erlang/macrolayer/**"
    - "src/org/intellij/erlang/parser/macro/**"
    - "tests/org/intellij/erlang/macrolayer/**"
    - "testData/macroLayer/**"
    - "testData/macroLayerOff/**"
    - "testData/macroFuzz/**"
    - "testData/macroSpikeProbes/**"
- name: psi-resolve
  label: area:psi-resolve
  description: "PSI classes, references and resolve of variables, functions, modules, includes and types."
  paths:
    - "src/org/intellij/erlang/psi/**"
    - "src/org/intellij/erlang/types/**"
    - "src/org/intellij/erlang/ErlangReferenceContributor.java"
    - "tests/org/intellij/erlang/psi/**"
    - "tests/org/intellij/erlang/resolve/**"
    - "tests/org/intellij/erlang/performance/**"
    - "testData/resolve/**"
    - "testData/performance/**"
- name: stubs-index
