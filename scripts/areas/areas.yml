    - "src/org/intellij/erlang/index/**"
    - "src/org/intellij/erlang/ErlangElementTypeFactory.java"
    - "tests/org/intellij/erlang/stubs/**"
    - "tests/org/intellij/erlang/index/**"
    - "testData/stubs/**"
