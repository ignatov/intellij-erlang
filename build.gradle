import org.jetbrains.intellij.platform.gradle.TestFrameworkType
import org.jetbrains.intellij.platform.gradle.extensions.IntelliJPlatformDependenciesExtension
import org.jetbrains.intellij.platform.gradle.tasks.VerifyPluginTask

plugins {
  id 'org.jetbrains.intellij.platform' version '2.20.1'
}

apply plugin: 'org.jetbrains.intellij.platform'

subprojects {
  apply plugin: 'org.jetbrains.intellij.platform.module'
}


allprojects {
  repositories { mavenCentral() }

  dependencies {
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.6.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.6.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.6.3'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.6.3'
    testCompileOnly 'junit:junit:4.13.1'
  }

  apply plugin: 'java'
  
  // Only apply the main Java version if this is not the JPS module
  // JPS module defines its own bytecode compatibility separately (Java 11)
  if (project.name != 'jps-plugin') {
    java {
      sourceCompatibility = JavaVersion.toVersion(javaVersion)
      targetCompatibility = JavaVersion.toVersion(javaTargetVersion)
    }
  }
  
  tasks.withType(JavaCompile).configureEach { 
    options.encoding = 'UTF-8' 
  }

  sourceSets {
    main {
      java.srcDirs 'src', 'gen'
      resources.srcDirs 'resources', 'plugin/resources'
    }
    test {
      java.srcDir 'tests'
    }
  }

  intellijPlatform {
    version = "${version}.$buildNumber"
//    plugins = ['copyright', 'java']
//    downloadSources = Boolean.valueOf(sources)
//    sameSinceUntilBuild = Boolean.valueOf(isEAP)
  }

  composedJar {
    archiveVersion = ""
  }

  repositories {
    intellijPlatform {
      defaultRepositories()
    }
  }

  dependencies {
    intellijPlatform { IntelliJPlatformDependenciesExtension ijp ->
      // https://data.services.jetbrains.com/products?code=IC
      ijp.intellijIdea("2026.3")

      ijp.bundledPlugins("com.intellij.copyright", "com.intellij.java", "tanvd.grazi",
                         "com.intellij.platform.testRunner", "com.intellij.structureView")
      ijp.bundledModule("intellij.platform.debugger")
      ijp.testFramework(TestFrameworkType.Platform.INSTANCE)
      ijp.testFramework(TestFrameworkType.Plugin.Java.INSTANCE)
    }
  }
  
  def compilationPackages = ['org/intellij/erlang/build/**', 'org/intellij/erlang/jps/**']

  tasks.withType(Test).configureEach {
    jvmArgs = [
      '-Djava.awt.headless=true'
    ]
  }

  test {
    environment 'NO_FS_ROOTS_ACCESS_CHECK', 'true'
    useJUnitPlatform {
      exclude compilationPackages
    }
    testLogging {
      exceptionFormat = 'full'
    }
  }

  // The compilation tests need the same IDE classpath and sandbox as `test`, so let the IntelliJ Platform
  // Gradle plugin create and configure the task instead of declaring a plain Test task.
  intellijPlatformTesting.testIde.register('testCompilation') {
    task {
      group = 'verification'
      description = 'Runs the Erlang JPS and external build tests; requires -Derlang.sdk.path=<Erlang root>.'
      environment 'NO_FS_ROOTS_ACCESS_CHECK', 'true'
      useJUnitPlatform()
      include compilationPackages
      testLogging {
        exceptionFormat = 'full'
      }
      systemProperty 'erlang.sdk.path', System.getProperty('erlang.sdk.path', '')
    }
  }
  // Custom test tasks get their own dependency configurations; reuse the test frameworks declared for `test`.
  configurations.matching { it.name == 'intellijPlatformTestDependencies_testCompilation' }.configureEach {
    extendsFrom(configurations.intellijPlatformTestDependencies)
  }
}

repositories {
  flatDir {
    dirs 'libs'
  }
}

dependencies {
  implementation name: 'OtpErlang'
  // JPS is a shared library loaded by both the IDE and the compile server, not a content module.
  implementation files(project(':jps-plugin').tasks.named('composedJar'))
}

intellijPlatform {
  pluginVerification {
    // The existing Marketplace plugin predates the restriction on org.jetbrains plugin IDs.
    freeArgs = ['-mute', 'ForbiddenPluginIdPrefix']
    // Gate releases on binary compatibility; legacy API usages remain visible in the report.
    failureLevel = [VerifyPluginTask.FailureLevel.COMPATIBILITY_PROBLEMS,
                    VerifyPluginTask.FailureLevel.MISSING_DEPENDENCIES,
                    VerifyPluginTask.FailureLevel.INVALID_PLUGIN,
                    VerifyPluginTask.FailureLevel.OVERRIDE_ONLY_API_USAGES]
    ides {
      current()
    }
  }
  // Only the root project applies the full platform plugin, so jps-plugin has no publishPlugin task.
  // The release workflow supplies PUBLISH_TOKEN from the JETBRAINS_MARKETPLACE_TOKEN secret.
  publishing {
    token = providers.environmentVariable('PUBLISH_TOKEN')
    channels = ['default']
  }
}

// Add JPS Java 11 verification to the plugin build pipeline
afterEvaluate {
  // The JPS helper module is packaged into the main plugin but intentionally keeps
  // Java 11 bytecode compatibility, so the generic IntelliJ Platform module check
  // produces a misleading sourceCompatibility warning for the target platform.
  project(':jps-plugin').tasks.named('verifyPluginProjectConfiguration') {
    enabled = false
  }

  tasks.named('prepareSandbox') {
    dependsOn ':jps-plugin:verifyJpsJava11Compatibility'
  }
  
  tasks.named('buildPlugin') {
    dependsOn ':jps-plugin:verifyJpsJava11Compatibility'
  }
  
  tasks.named('check') {
    dependsOn ':jps-plugin:verifyJpsJava11Compatibility'
  }
}

// The external build process loads the Erlang JPS plugin from the jars listed in
// <compileServer.plugin classpath="..."/>, resolved against the lib/ directory of the installed plugin.
// If a name doesn't match the packaged jar, the IDE only logs an internal error, the build process doesn't know
// Erlang modules and a build copies the .erl files to the output directory and reports success (#1077).
def verifyCompileServerPluginLayout = tasks.register('verifyCompileServerPluginLayout') {
  group = 'verification'
  description = 'Verifies that the plugin ZIP contains the jars that compileServer.plugin puts on the build process classpath.'
  def pluginZip = tasks.named('buildPlugin').flatMap { it.archiveFile }
  inputs.file(pluginZip)

  doLast {
    def readEntries = { InputStream jarStream ->
      def result = [:]
      def jar = new java.util.zip.ZipInputStream(jarStream)
      for (def entry = jar.nextEntry; entry != null; entry = jar.nextEntry) {
        result[entry.name] = entry.name.endsWith('.class') || entry.name.startsWith('META-INF/') ? jar.readAllBytes() : null
      }
      result
    }

    def zip = new java.util.zip.ZipFile(pluginZip.get().asFile)
    try {
      def names = zip.entries().collect { it.name }
      def libDir = names.find { it ==~ /[^\/]+\/lib\// }
      if (libDir == null) throw new GradleException("No lib/ directory in ${zip.name}")
      def mainJar = zip.getEntry(libDir + 'intellij-erlang.jar')
      if (mainJar == null) throw new GradleException("No ${libDir}intellij-erlang.jar in ${zip.name}")
      def javaDeps = readEntries(zip.getInputStream(mainJar))['META-INF/java-deps.xml']
      if (javaDeps == null) throw new GradleException('No META-INF/java-deps.xml in intellij-erlang.jar')
      def classpath = new groovy.xml.XmlSlurper().parse(new ByteArrayInputStream(javaDeps))
        .depthFirst().find { it.name() == 'compileServer.plugin' }?.@classpath?.text()
      if (!classpath) throw new GradleException('java-deps.xml does not register compileServer.plugin with a classpath')

      def jpsJarFound = false
      classpath.split(';').each { String jarName ->
        def jarEntry = zip.getEntry(libDir + jarName)
        if (jarEntry == null) {
          throw new GradleException("compileServer.plugin refers to ${libDir}${jarName}, which is not in ${zip.name}. " +
                                    "Jars in ${libDir}: ${names.findAll { it.startsWith(libDir) && it != libDir }}")
        }
        def jarEntries = readEntries(zip.getInputStream(jarEntry))
        if (jarEntries.containsKey('META-INF/services/org.jetbrains.jps.incremental.BuilderService')) {
          jpsJarFound = true
          ['META-INF/services/org.jetbrains.jps.model.serialization.JpsModelSerializerExtension',
           'org/intellij/erlang/jps/builder/ErlangBuilder.class',
           'org/intellij/erlang/jps/model/JpsErlangModelSerializerExtension.class'].each {
            if (!jarEntries.containsKey(it)) throw new GradleException("${jarName} does not contain ${it}")
          }
          // The build process may run on an older JDK than the IDE, so the JPS plugin keeps Java 11 bytecode.
          jarEntries.findAll { it.key.endsWith('.class') }.each { String name, byte[] bytes ->
            int major = ((bytes[6] & 0xFF) << 8) | (bytes[7] & 0xFF)
            if (major > 55) throw new GradleException("${jarName}!/${name} has class file version ${major}, expected Java 11 (55) or lower")
          }
        }
      }
      if (!jpsJarFound) {
        throw new GradleException("None of the compileServer.plugin jars (${classpath}) registers a JPS BuilderService")
      }
      logger.lifecycle("compileServer.plugin classpath '${classpath}' matches the layout of ${zip.name}")
    }
    finally {
      zip.close()
    }
  }
}

tasks.named('buildPlugin') {
  finalizedBy verifyCompileServerPluginLayout
}
tasks.named('check') {
  dependsOn verifyCompileServerPluginLayout
}

apply plugin: 'idea'
idea {
  project {
    jdkName = javaVersion
    languageLevel = javaVersion
  }
  module {
    generatedSourceDirs += file('gen')
  }
}
